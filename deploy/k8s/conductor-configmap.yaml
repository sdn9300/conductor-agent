apiVersion: v1
kind: ConfigMap
metadata:
  name: conductor-config
  namespace: default
  labels:
    app: conductor-agent
data:
  CANDIDATE_ID: "sdn9300"
  CANDIDATE_NAME: "Soumyadeep Nath"
  CANDIDATE_EMAIL: "soumyadeepnath@example.com"
